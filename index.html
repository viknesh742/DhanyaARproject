<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Space Mission</title>

<!-- A-Frame (3D) and AR.js (marker tracking) -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(8, 14, 40, 0.82); color: #fff;
    padding: 10px 12px 14px; text-align: center;
  }
  #panel button {
    margin: 3px; padding: 9px 14px; border: 0; border-radius: 8px;
    font-size: 15px; background: #2c4a9a; color: #fff;
  }
  #panel button.active { background: #f2b134; color: #1a1a1a; }
  #title { font-size: 17px; font-weight: 600; margin-top: 6px; }
  #facts { font-size: 14px; margin-top: 4px; line-height: 1.4; }
  #hint { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 10;
          color: #fff; background: rgba(8,14,40,.7); padding: 6px 10px;
          border-radius: 8px; font-size: 13px; text-align: center; }
</style>
</head>

<body>
<div id="hint">Mission 1: Planets. Point the camera at the Hiro marker.</div>

<a-scene embedded
         arjs="sourceType: webcam; debugUIEnabled: false;"
         vr-mode-ui="enabled: false">

  <a-marker preset="hiro">
    <!-- The planet floats above the marker and spins slowly -->
    <a-sphere id="planet" position="0 1 0" radius="0.7" color="#2a6fdb"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
    </a-sphere>
    <!-- Ring is only visible for Saturn -->
    <a-ring id="ring" position="0 1 0" rotation="-70 0 0"
            radius-inner="1" radius-outer="1.6" color="#d9c38a"
            material="side: double" visible="false"></a-ring>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="panel">
  <div id="buttons"></div>
  <div id="title"></div>
  <div id="facts"></div>
</div>

<script>
  // Planet data. Edit or add more planets here.
  var planets = {
    Earth:   { color: "#2a6fdb", size: 0.7, ring: false,
               facts: "Diameter 12,742 km. Day: 24 hours. Gravity: 9.8 m/s²." },
    Mars:    { color: "#c1440e", size: 0.5, ring: false,
               facts: "Diameter 6,779 km. Day: 24.6 hours. Gravity: 3.7 m/s²." },
    Jupiter: { color: "#d8a066", size: 1.0, ring: false,
               facts: "Diameter about 139,820 km. Day: about 10 hours. Gravity: 24.8 m/s²." },
    Saturn:  { color: "#e3c88a", size: 0.8, ring: true,
               facts: "Diameter about 116,460 km. Day: about 10.7 hours. Gravity: 10.4 m/s²." }
  };

  var planetEl = document.getElementById("planet");
  var ringEl = document.getElementById("ring");
  var buttonsEl = document.getElementById("buttons");

  function showPlanet(name) {
    var p = planets[name];
    planetEl.setAttribute("color", p.color);
    planetEl.setAttribute("radius", p.size);
    ringEl.setAttribute("visible", p.ring);
    document.getElementById("title").textContent = name;
    document.getElementById("facts").textContent = p.facts;
    var all = buttonsEl.querySelectorAll("button");
    for (var i = 0; i < all.length; i++) {
      all[i].className = all[i].textContent === name ? "active" : "";
    }
  }

  // Build one button per planet
  Object.keys(planets).forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name;
    b.onclick = function () { showPlanet(name); };
    buttonsEl.appendChild(b);
  });

  showPlanet("Earth");
</script>
</body>
</html>
